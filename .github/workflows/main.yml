on: [push]

jobs:
  build-and-run-in-bash:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    name: Build and run in Bash
    steps:
      - uses: actions/checkout@v4
      - uses: radekm/setup-c3@9ce6f5ae61f4d0a9a4c7354868c903f21ea01bda
        with:
          version: v0.8.4
      - shell: bash
        run: c3c compile-run --lib somelib someprogram.c3
  build-and-run-in-cmd:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    name: Build and run in cmd
    steps:
      - uses: actions/checkout@v4
      - uses: radekm/setup-c3@9ce6f5ae61f4d0a9a4c7354868c903f21ea01bda
        with:
          version: v0.8.4
      - shell: cmd
        run: c3c compile-run --lib somelib someprogram.c3
